# AI 小说剧本化工作台生成结果
# 输出格式：YAML
# 本文件可继续人工编辑和二次创作
schema_version: "1.0"
story_bible:
  title: "雨夜迷踪"
  genre: "悬疑"
  theme: "真相与救赎"
  world_setting: "现代都市"
  main_conflict: "林澈寻找失踪妹妹的过程中发现惊天秘密"
  characters:
    - id: "char_001"
      name: "林澈"
      role: "protagonist"
      personality: "冷静、敏感"
      goal: "找到妹妹失踪真相"
      relationship: "与沈眠是旧识"
    - id: "char_002"
      name: "沈眠"
      role: "supporting"
      personality: "神秘、睿智"
      goal: "保护旧书店的秘密"
      relationship: "林澈的旧友"
    - id: "char_003"
      name: "苏雨"
      role: "supporting"
      personality: "年轻、焦虑"
      goal: "寻找姐姐沈眠"
      relationship: "沈眠的妹妹"
    - id: "char_004"
      name: "陈志远"
      role: "antagonist"
      personality: "伪善、阴险"
      goal: "掩盖陈家秘密"
      relationship: "陈氏集团律师"
  locations:
    - id: "loc_001"
      name: "南城旧街"
      description: "潮湿、昏暗、充满旧时代气息"
    - id: "loc_002"
      name: "旧书店"
      description: "林澈与沈眠相遇的地方，充满檀香和陈旧纸张气息"
    - id: "loc_003"
      name: "沈眠公寓"
      description: "清晨、薄雾、安全屋"
chapters:
  - chapter_id: "chapter_001"
    title: "第一章 雨夜来客"
    scenes:
      - scene_id: "scene_001"
        scene_title: "雨夜中的旧书店"
        location: "南城旧街旧书店"
        time: "夜晚"
        characters:
          - "林澈"
          - "沈眠"
        summary: "林澈在雨夜进入旧书店，遇见多年未见的沈眠。"
        beats:
          - type: "action"
            content: "窗外的大雨已经下了整整三天。南城旧街的青石板路被雨水冲刷得发亮，两旁的老式路灯在雾气中摇曳。"
          - type: "action"
            content: "林澈推开旧书店的门，雨水顺着他的黑色外套滴落在地上。门上的铜铃发出清脆的响声。"
          - type: "action"
            content: "店里弥漫着陈旧纸张特有的气息，混合着淡淡的檀香。四周的书架高耸入云，柜台后面一盏台灯散发着昏黄的光。"
          - type: "dialogue"
            speaker: "沈眠"
            content: "你终于来了。"
          - type: "narration"
            content: "林澈没有立刻回答。他的目光穿过层层书架，落在柜台后面的那个身影上。多年的岁月在那张脸上留下了痕迹，但她依然是记忆中的模样。"
          - type: "dialogue"
            speaker: "林澈"
            content: "我找了你十年。"
          - type: "dialogue"
            speaker: "沈眠"
            content: "我知道你会来。只是没想到会是在今晚。"
      - scene_id: "scene_002"
        scene_title: "神秘来客"
        location: "旧书店门口"
        time: "夜晚"
        characters:
          - "林澈"
          - "沈眠"
          - "苏雨"
        summary: "一个年轻女人出现在门口，打断了林澈和沈眠的对话。"
        beats:
          - type: "action"
            content: "门外传来急促的脚步声。一个年轻女人出现在门口，她穿着一件米色的风衣，长发被雨水打湿，贴在脸上。"
          - type: "dialogue"
            speaker: "苏雨"
            content: "沈眠姐，我——"
          - type: "narration"
            content: "女人的声音在看到林澈时戛然而止，眼神里闪过一丝惊讶。"
          - type: "transition"
            content: "画面切换至：第二天清晨，南城旧街。"
  - chapter_id: "chapter_002"
    title: "第二章 黑色信封"
    scenes:
      - scene_id: "scene_001"
        scene_title: "清晨对话"
        location: "旧书店"
        time: "清晨"
        characters:
          - "林澈"
          - "沈眠"
        summary: "林澈一夜未眠，沈眠为他泡茶，两人谈论苏雨的身份。"
        beats:
          - type: "action"
            content: "第二天清晨，南城旧街笼罩在一层薄雾中。林澈一夜未眠，反复翻看父亲留下的地图。"
          - type: "action"
            content: "沈眠端着两杯热茶走过来，将其中一杯放在林澈面前。"
          - type: "dialogue"
            speaker: "沈眠"
            content: "喝点热的，暖暖身子。"
          - type: "dialogue"
            speaker: "林澈"
            content: "那个女人是谁？"
          - type: "dialogue"
            speaker: "沈眠"
            content: "她叫苏雨，是我妹妹。"
          - type: "action"
            content: "林澈的目光猛地一凝。"
          - type: "dialogue"
            speaker: "林澈"
            content: "你妹妹？你不是独生子吗？"
          - type: "dialogue"
            speaker: "沈眠"
            content: "那是十年前的事了。那场火灾之后，一切都变了。"
      - scene_id: "scene_002"
        scene_title: "律师来访"
        location: "旧书店"
        time: "清晨"
        characters:
          - "林澈"
          - "沈眠"
          - "陈志远"
        summary: "陈志远律师带来陈老先生的信和道歉。"
        beats:
          - type: "action"
            content: "就在这时，门外传来敲门声。一个穿着制服的中年男人站在门口，脸上带着职业性的微笑。"
          - type: "dialogue"
            speaker: "陈志远"
            content: "林澈先生？我是陈志远，陈氏集团的律师。"
          - type: "action"
            content: "陈志远从公文包里取出一个黑色的信封，放在桌上。"
          - type: "dialogue"
            speaker: "陈志远"
            content: "这是陈老先生让我转交给你的。他说，等你看完这封信，一切都会明白。"
          - type: "action"
            content: "林澈拿起信封。信封很厚，里面似乎装着不止一页纸，还有某种硬物的轮廓。"
          - type: "dialogue"
            speaker: "陈志远"
            content: "陈老先生还让我带了一句话。他说，对不起。"
          - type: "transition"
            content: "画面切换至：林澈离开旧书店，走进雨幕中。"
  - chapter_id: "chapter_003"
    title: "第三章 旧街谜案"
    scenes:
      - scene_id: "scene_001"
        scene_title: "林澈离去"
        location: "南城旧街"
        time: "清晨"
        characters:
          - "林澈"
          - "沈眠"
        summary: "林澈收好信封，准备离开旧书店，沈眠叮嘱他小心。"
        beats:
          - type: "action"
            content: "林澈看着律师离开的背影，没有说话。他将信封收进外套内侧的口袋里，然后站起身。"
          - type: "dialogue"
            speaker: "林澈"
            content: "我要走了。"
          - type: "action"
            content: "沈眠点点头，似乎早就预料到了。"
          - type: "dialogue"
            speaker: "沈眠"
            content: "小心点。如果有任何问题，立刻联系我。"
          - type: "action"
            content: "林澈推开门，冷风夹着细雨扑面而来。他大步走进雨幕中，很快消失在街道的尽头。"
          - type: "narration"
            content: "信封里的秘密，即将揭晓。而十年前的火灾真相，也将随着林澈的深入调查而浮出水面。"
